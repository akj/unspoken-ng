name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests/

  package:
    name: package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install SCons==4.10.1 Markdown==3.10.2
      - run: scons
      - run: python .github/scripts/verify_artifact.py
      - uses: actions/upload-artifact@v7
        with:
          name: nvda-addon
          path: "*.nvda-addon"
          if-no-files-found: error
